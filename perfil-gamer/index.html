<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B0E14" />
<title>Perfil Gamer — Biblioteca de Jogos</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Perfil Gamer" />
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface2:#E4E9F2; --ink:#141A26; --muted:#61697A; --line:#D8DEE9;
  --accent:#2E6FF2; --accent2:#7B4DF2; --accent-soft:rgba(46,111,242,.10);
  --mp:#C98A00; --mb:#0E9A48; --bo:#2563EB; --me:#525C6B; --ru:#DE5A0C; --mr:#CE2626;
  --mp-s:rgba(201,138,0,.18); --mb-s:rgba(14,154,72,.16); --bo-s:rgba(37,99,235,.15);
  --me-s:rgba(82,92,107,.17); --ru-s:rgba(222,90,12,.16); --mr-s:rgba(206,38,38,.15);
  --von:#FFFFFF;
  --shadow:0 4px 16px rgba(20,26,38,.07);
  --hero:linear-gradient(135deg,#182036 0%,#101624 60%,#131C30 100%);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B0E14; --surface:#131824; --surface2:#1B2232; --ink:#EAEEF6; --muted:#8A94A8; --line:#232C40;
    --accent:#4D8DFF; --accent2:#9D7BFF; --accent-soft:rgba(77,141,255,.13);
    --mp:#F5C518; --mb:#2FD675; --bo:#5B9DFF; --me:#A6B2C6; --ru:#FF8A3D; --mr:#FF5C5C;
    --mp-s:rgba(245,197,24,.20); --mb-s:rgba(47,214,117,.18); --bo-s:rgba(91,157,255,.18);
    --me-s:rgba(166,178,198,.20); --ru-s:rgba(255,138,61,.18); --mr-s:rgba(255,92,92,.17);
    --von:#12161F;
    --shadow:0 4px 18px rgba(0,0,0,.4);
    --hero:linear-gradient(135deg,#1A2340 0%,#12182B 55%,#1B1530 100%);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  padding:env(safe-area-inset-top) 0 0;
}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding:0 14px calc(96px + env(safe-area-inset-bottom))}

/* ---------- cabeçalho ---------- */
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 2px 12px}
.brand{display:flex;align-items:center;gap:9px}
.brand .logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:19px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 12px var(--accent-soft)}
.brand h1{margin:0;font-size:1.06rem;font-weight:800;letter-spacing:.02em;line-height:1.1}
.brand small{display:block;font-weight:600;font-size:.64rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.synctag{font-size:.6rem;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--mb-s);color:var(--mb);white-space:nowrap}
.synctag.off{background:var(--surface2);color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);width:36px;height:36px;
  border-radius:11px;font-size:1.15rem;font-weight:800;line-height:1;cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
.iconbtn:active{transform:scale(.96)}

/* ---------- hero "jogando agora" ---------- */
.hero{background:var(--hero);color:#EAEEF6;border-radius:18px;padding:12px 15px;margin-bottom:10px;
  position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-30px;top:-40px;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle,rgba(77,141,255,.25),transparent 70%)}
.hero .tagline{font-size:.6rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8FB4FF}
.hero .hname{font-size:1.12rem;font-weight:800;margin:3px 0 2px;line-height:1.25}
.hero .hmeta{font-size:.74rem;color:#AAB6CE}
.hero .hrow{display:flex;align-items:center;gap:12px}
.hero .hicon{font-size:1.6rem}
.hero .hbody{flex:1;min-width:0}
.hero .hgo{font-size:1.3rem;color:#8FB4FF;font-weight:800}

/* ---------- faixa de stats ---------- */
.strip{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:9px 4px;margin-bottom:11px;box-shadow:var(--shadow)}
.strip .cell{flex:1;text-align:center;border-right:1px solid var(--line)}
.strip .cell:last-child{border-right:0}
.strip .v{font-size:1.02rem;font-weight:800}
.strip .k{font-size:.56rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:1px;font-weight:700}

/* ---------- busca / filtros ---------- */
.searchrow{display:flex;gap:8px;align-items:stretch;margin-top:2px}
.search{flex:1;min-width:0;width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--surface);
  color:var(--ink);font:inherit;font-size:.86rem}
.search::placeholder{color:var(--muted)}
/* botão registrar compacto (só ícone) ao lado da busca */
.addmini{flex:0 0 auto;display:grid;place-items:center;width:40px;border:0;border-radius:11px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:1.15rem;font-weight:800;
  cursor:pointer;box-shadow:0 4px 12px var(--accent-soft)}
.addmini:active{transform:scale(.95)}
/* resumo do conjunto filtrado (cartão) */
.fsummary{margin:4px 2px 14px;padding:11px 13px;border:1px solid var(--line);border-radius:14px;
  background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.fshead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.fshead .fslbl{font-size:.56rem;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--muted)}
.fsnums{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;margin-left:auto;
  font-size:.82rem;color:var(--muted);font-weight:600}
.fsnums .fsstat b{color:var(--ink);font-weight:800;font-size:.98rem}
.fsnums .fssep{color:var(--line)}
.fsbar{display:flex;height:7px;border-radius:999px;overflow:hidden;margin:10px 0 2px;background:var(--surface2)}
.fsbar>span{display:block;height:100%;min-width:2px}
.fsrows{display:flex;flex-direction:column;gap:1px;margin-top:8px}
.fsrow{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:.8rem;font-weight:700;color:var(--ink)}
.fsrow .fsdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.fsrow .fsnm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsrow .fsn{font-weight:800;font-variant-numeric:tabular-nums}
.fsrow .fspct{width:38px;text-align:right;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.search:focus-visible{outline:2px solid var(--accent);border-color:var(--accent)}
.fbar{display:flex;gap:8px;margin-top:10px}
.fbtn{flex:1;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;
  font-size:.88rem;font-weight:800;padding:12px;border-radius:13px;cursor:pointer}
.fbtn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.fbar select{flex:1;padding:12px 10px;border:1.5px solid var(--line);border-radius:13px;background:var(--surface);
  color:var(--ink);font:inherit;font-size:.86rem;font-weight:600}
.achips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.achip{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:7px 12px;cursor:pointer;
  font:inherit;font-size:.74rem;font-weight:800;background:var(--vs,var(--accent-soft));color:var(--vc,var(--accent))}
.achip .x{opacity:.7;font-weight:800}
.achip.clear{background:var(--surface2);color:var(--muted)}
.fgroup{margin-top:14px}
.fgroup .glabel{font-size:.62rem;color:var(--muted);font-weight:800;letter-spacing:.09em;text-transform:uppercase;margin:0 2px 8px}
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{border:1.5px solid var(--line);background:var(--bg);color:var(--muted);font:inherit;font-size:.84rem;
  font-weight:700;padding:11px 15px;border-radius:12px;cursor:pointer}
.tchip.on{border-color:var(--vc,var(--accent));color:var(--vc,var(--accent));background:var(--vs,var(--accent-soft));font-weight:800}
.tchip:active{transform:scale(.97)}
/* chips de filtro inline (aba Jogos) — pílulas calmas, cor só quando ativas */
.flabel{font-size:.58rem;color:var(--muted);font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin:11px 2px 0}
.frow{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);font:inherit;font-size:.76rem;font-weight:700;padding:7px 12px;border-radius:999px;
  cursor:pointer;white-space:nowrap}
.fchip .cdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.fchip.on{color:var(--von,#fff);font-weight:800;border-color:transparent;background:var(--vc,var(--accent));
  box-shadow:0 2px 8px rgba(0,0,0,.10)}
.fchip.on .cdot{background:var(--von,#fff)!important;opacity:.9}
.fchip.clear{margin-left:auto;color:var(--mr);border-style:dashed}
.fchip:active{transform:scale(.96)}
.filterbar{display:flex;align-items:center;gap:10px;margin:12px 0 0}
.filttoggle{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);font:inherit;font-size:.8rem;font-weight:800;padding:9px 13px;border-radius:12px;cursor:pointer}
.filttoggle .chev{color:var(--muted);font-size:.7rem;transition:transform .18s ease}
.filttoggle.open .chev{transform:rotate(180deg)}
.filttoggle .fbadge{background:var(--accent);color:#fff;border-radius:999px;font-size:.62rem;font-weight:800;
  min-width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.filttoggle:active{transform:scale(.97)}
.filterbar .count{margin-left:auto}
.filterpanel{margin:6px 0 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);
  padding:2px 12px 12px;animation:fadeUp .18s ease}
.factive{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 12px}
.factive .fchip.clear{margin-left:0}
.fchip.sm{padding:5px 10px;font-size:.68rem;font-weight:700}
.panelfoot{display:flex;align-items:center;gap:10px;margin-top:16px}
.panelapply{flex:1;text-align:center;border:0;border-radius:12px;background:var(--accent);color:#fff;
  font:inherit;font-size:.84rem;font-weight:800;padding:12px 16px;cursor:pointer}
.panelapply:active{transform:scale(.98)}
.toolrow{display:flex;align-items:center;gap:8px;margin:11px 0 12px}
.toolrow select{flex:1;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);
  color:var(--ink);font:inherit;font-size:.84rem;font-weight:600}
.count{flex:0 0 auto;font-size:.7rem;color:var(--muted);font-weight:700}
.addbtn{width:100%;border:0;border-radius:13px;padding:11px;font:inherit;font-size:.9rem;font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;cursor:pointer;margin:0 0 10px;
  box-shadow:0 6px 16px var(--accent-soft)}
.addbtn:active{transform:scale(.99)}

/* ---------- card de jogo ---------- */
.game{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  margin-bottom:8px;overflow:hidden;position:relative}
.game::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--vc,var(--line));z-index:1}
.game.open{border-color:var(--vc,var(--accent))}
.gsum{cursor:pointer;padding:12px 14px 12px 16px}
.gsum:active{background:var(--surface2)}
.grow{display:flex;align-items:center;gap:10px}
.gname{flex:1;min-width:0;font-weight:750;font-size:.94rem;line-height:1.3}
.vpill{flex:0 0 auto;font-size:.63rem;font-weight:800;letter-spacing:.04em;padding:5px 10px;border-radius:8px;
  background:var(--vc,var(--surface2));color:var(--von,var(--muted));white-space:nowrap}
.gmeta{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-size:.7rem;color:var(--muted);font-weight:600}
.gmeta .hrs{color:var(--ink);font-weight:800}
.gbody{padding:2px 14px 13px 16px;border-top:1px solid var(--line)}
.gbody .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.stat{background:var(--surface2);border-radius:11px;padding:8px 11px;font-size:.66rem;color:var(--muted);font-weight:700}
.stat b{color:var(--ink);font-size:.84rem;display:block;font-weight:800}
.gnote{font-size:.78rem;color:var(--muted);margin-top:10px;line-height:1.55}
.gnote b{color:var(--ink)}
.internal{font-size:.6rem;color:var(--muted);opacity:.7;margin-top:9px;letter-spacing:.03em}
.cardbtns{display:flex;gap:8px;margin-top:12px}
.cbtn{flex:1;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit;
  font-size:.78rem;font-weight:700;padding:10px;border-radius:11px;cursor:pointer}
.cbtn:active{transform:scale(.98)}
.cbtn.del{color:var(--mr)}
/* editor inline dentro do card */
.gedit{padding:0 14px 14px 16px;border-top:1px solid var(--line);animation:fadeUp .18s ease}
.gedit .el{display:block;font-size:.6rem;color:var(--muted);font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin:11px 0 0}
.gedit .el2{display:block;font-size:.58rem;color:var(--muted);font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:0 0 4px}
.gedit input,.gedit select,.gedit textarea{width:100%;margin-top:4px;padding:10px 11px;border:1.5px solid var(--line);
  border-radius:11px;background:var(--bg);color:var(--ink);font:inherit;font-size:.92rem;font-weight:600}
.gedit .mrow4 input{margin-top:0}
.gedit textarea{min-height:50px;resize:vertical}
.gedit input:focus-visible,.gedit select:focus-visible,.gedit textarea:focus-visible{outline:2px solid var(--accent);border-color:var(--accent)}
.gedit .erow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gedit .erow3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gedit .erow3 input{padding-left:8px;padding-right:6px}
.gedit .mrow4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.gedit .checkline{display:flex;align-items:center;gap:9px;font-size:.82rem;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:700;margin:13px 0 0;cursor:pointer}
.gedit .checkline input{width:18px;height:18px;margin:0;flex:0 0 auto}
.gedit .internal-fields{margin-top:12px;border:1px dashed var(--line);border-radius:12px;padding:9px 12px}
.gedit .internal-fields summary{cursor:pointer;font-size:.72rem;color:var(--muted);font-weight:700;list-style:none}
.gedit .internal-fields summary::-webkit-details-marker{display:none}
.grunrow{display:flex;align-items:center;gap:8px;margin-top:6px}
.grunrow .rlbl{flex:0 0 auto;background:var(--surface2);color:var(--muted);border-radius:7px;padding:4px 8px;font-size:.66rem;font-weight:800}
.grunrow .runh{flex:1;margin-top:0}
.grunrow .hh{color:var(--muted);font-size:.72rem}
.grunrow .runano{flex:0 0 68px;margin-top:0;text-align:center;padding-left:4px;padding-right:4px}
.grunrow .pbtn{width:30px;height:30px;flex:0 0 auto}

/* ---------- estatísticas ---------- */
h2{font-size:.78rem;margin:20px 4px 9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:13px 14px;margin-bottom:10px}
.bar{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.bar:last-child{margin-bottom:0}
.bar .lbl{flex:0 0 96px;font-size:.7rem;font-weight:800;text-align:right}
.bar .track{flex:1;height:22px;background:var(--surface2);border-radius:8px;overflow:hidden}
.bar .fill{height:100%;border-radius:8px;min-width:3px;display:flex;align-items:center;justify-content:flex-end;
  padding-right:6px;font-size:.62rem;font-weight:800;color:var(--von,#fff)}
.bar .val{flex:0 0 40px;font-size:.7rem;color:var(--muted);font-weight:700}
/* gráfico de distribuição configurável (Estatísticas) */
.dbar{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.dbar:last-child{margin-bottom:0}
.dbar .dblbl{flex:0 0 92px;font-size:.71rem;font-weight:800;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbar .dbtrack{flex:1;min-width:0;height:14px;background:var(--surface2);border-radius:999px;overflow:hidden}
.dbar .dbfill{height:100%;border-radius:999px;min-width:4px;transition:width .25s ease}
.dbar .dbval{flex:0 0 66px;display:flex;align-items:baseline;justify-content:flex-end;gap:5px}
.dbar .dbval.stack{flex:0 0 70px;align-items:flex-end}
.dbar .dbval b{font-size:.86rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.dbar .dbval .dbpct{font-size:.68rem;color:var(--muted);font-weight:700;
  font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
.dbstack{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.dbstack .dbsub{font-size:.6rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.dnote{font-size:.62rem;color:var(--muted);margin:10px 2px 0;line-height:1.4}
.rowline{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.82rem}
.rowline:last-child{border-bottom:0}
.rowline .pos{flex:0 0 22px;height:22px;border-radius:7px;background:var(--surface2);color:var(--muted);
  font-size:.66rem;font-weight:800;display:grid;place-items:center}
.rowline .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}
.rowline .hv{flex:0 0 auto;font-weight:800}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gcell{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;box-shadow:var(--shadow)}
.gcell .t{font-size:.76rem;font-weight:800;line-height:1.2}
.gcell .n{font-size:.62rem;color:var(--muted);margin-top:3px;font-weight:600;line-height:1.45}
.lead{color:var(--muted);font-size:.78rem;margin:0 2px 10px;line-height:1.5}

/* ---------- seções recolhíveis (estatísticas) ---------- */
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:9px;overflow:hidden}
details.sec>summary{cursor:pointer;list-style:none;padding:13px 15px;display:flex;align-items:center;gap:9px;
  font-size:.8rem;font-weight:800;letter-spacing:.03em}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .sic{font-size:1rem}
details.sec>summary .ssub{margin-left:auto;font-size:.68rem;color:var(--muted);font-weight:700}
details.sec>summary .schev{color:var(--muted);font-size:.8rem;transition:transform .18s;margin-left:6px}
details.sec[open]>summary .schev{transform:rotate(90deg)}
details.sec>summary:active{background:var(--surface2)}
.secbody{padding:2px 15px 14px}
.droprow{padding:8px 0;border-bottom:1px solid var(--line)}
.droprow:last-child{border-bottom:0}
.droprow .dhead{display:flex;align-items:center;gap:8px}
.droprow .dnm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650;font-size:.82rem}
.droprow .dhv{flex:0 0 auto;font-weight:800;font-size:.74rem;color:var(--muted)}
.droprow .dmot{font-size:.7rem;color:var(--muted);margin:3px 0 0 17px;line-height:1.45}

/* ---------- plano ---------- */
.pitem{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.pitem:last-child{border-bottom:0}
.pwhen{flex:0 0 50px;text-align:center;background:var(--accent-soft);color:var(--accent);border-radius:9px;
  font-size:.62rem;font-weight:800;padding:5px 2px;letter-spacing:.02em;line-height:1.1}
.pbody{flex:1;min-width:0}
.pbody .t{font-size:.82rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbody .s{font-size:.66rem;color:var(--muted);margin-top:1px;font-weight:700}
.pacts{display:flex;gap:5px;flex:0 0 auto}
.pbtn{border:1px solid var(--line);background:var(--surface2);color:var(--ink);width:30px;height:30px;

details.wkbox>summary .schev{color:var(--muted);font-size:.8rem;transition:transform .18s}
details.wkbox[open]>summary .schev{transform:rotate(90deg)}
.wkbody{padding:2px 14px 12px}

.wkrow:last-child{border-bottom:0}

.runrow .rlbl{flex:0 0 auto;background:var(--surface2);color:var(--muted);border-radius:7px;padding:2px 7px;font-size:.66rem;font-weight:800}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(4,6,11,.65);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.modal:not(.hidden){animation:fadeBg .2s ease}

.mbox{background:var(--surface);color:var(--ink);width:100%;max-width:640px;border-radius:22px 22px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}

@keyframes fadeBg{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(26px);opacity:.3}to{transform:none;opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
"use strict";
const ORD = ["Muito Ruim","Ruim","Mediano","Bom","Muito Bom","Masterpiece"];
const VC = {"Masterpiece":["var(--mp)","var(--mp-s)","🏆"],"Muito Bom":["var(--mb)","var(--mb-s)","▲"],
  "Bom":["var(--bo)","var(--bo-s)","●"],"Mediano":["var(--me)","var(--me-s)","–"],
  "Ruim":["var(--ru)","var(--ru-s)","▼"],"Muito Ruim":["var(--mr)","var(--mr-s)","✕"]};
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* ---------- ano de lançamento (seed + normalização p/ backfill na nuvem) ---------- */
// o seed (window.JOGOS) traz o ano oficial de cada jogo; a nuvem é a fonte da verdade e
// pode não ter o campo ainda — daí o backfill em boot() casando por id (e por nome, fallback).
const _normNome = s => String(s||"").toLowerCase().replace(/[®™:!.,'"’\-–—]/g,"").replace(/\s+/g," ").trim();
const _anoById = {}, _anoByName = {};
(window.JOGOS||[]).forEach(g=>{ if (g && g.ano){ _anoById[g.id]=g.ano; _anoByName[_normNome(g.nome)]=g.ano; } });
function anoSeed(g){ return (g && (_anoById[g.id] || _anoByName[_normNome(g.nome)])) || null; }

/* ---------- nuvem (Firebase RTDB do casal, receita 1) ---------- */
const SYNC_URL = "https://apps-4b887-default-rtdb.firebaseio.com/planos/perfil-gamer-dt2026";
const LS_KEY = "perfil-gamer:jogos";
let J = window.JOGOS || [];
let cloudOK = false;
let syncStamp = 0;

function saveJogos(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(J)); } catch(e){}
  fetch(`${SYNC_URL}/jogos.json`, { method:"PUT", body: JSON.stringify(J) })
    .then(()=>{ cloudOK = true; syncStamp = Date.now();
      fetch(`${SYNC_URL}/_at.json`, { method:"PUT", body: JSON.stringify(syncStamp) }).catch(()=>{});
      render(); })
    .catch(()=>{ cloudOK = false; render(); });
}
// salva sem re-renderizar (edição inline do card — não perde foco enquanto digita)
function saveJogosQuiet(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(J)); } catch(e){}
  fetch(`${SYNC_URL}/jogos.json`, { method:"PUT", body: JSON.stringify(J) })
    .then(()=>{ cloudOK = true; syncStamp = Date.now();
      fetch(`${SYNC_URL}/_at.json`, { method:"PUT", body: JSON.stringify(syncStamp) }).catch(()=>{}); })
    .catch(()=>{ cloudOK = false; });
}
// edição inline: commit dos campos do card ao sair de cada campo
document.addEventListener("change", e=>{
  if (e.target.id==="padSemana"){
    const v = Math.max(0, Math.round(Number(e.target.value)||0));
    padraoSemana = v; savePlano(); render(); return; }
  const wk = e.target.closest("[data-wk]");
  if (wk){ const k=wk.dataset.wk;
    const v = wk.value==="" ? null : Math.max(0, Math.round(Number(wk.value)||0));
    if (v==null) delete HS[k]; else HS[k]=v;
    savePlano(); render(); return; }
  const card = e.target.closest(".game"); if (!card) return;
  const g = J.find(x=>x.id===Number(card.dataset.gid)); if (!g) return;
  const fld = e.target.closest("[data-f]");
  if (fld){
    const f = fld.dataset.f;
    if (f==="horas") g.horas = fld.value===""?0:Number(fld.value);
    else if (f==="ano"||f==="anoJog") g[f] = fld.value===""?null:Number(fld.value);
    else if (["h","g","d","ff"].includes(f)) g[f] = fld.value===""?null:Number(fld.value);
    else if (f==="v"||f==="enc") g[f] = fld.value;
    else if (f==="nome"){ const v=fld.value.trim(); if (v) g.nome=v; else fld.value=g.nome; }
    else g[f] = fld.value.trim();
    saveJogosQuiet();
    if (f==="v"||f==="enc"||f==="nome"||f==="ano"||f==="anoJog") render();  // atualiza pill/cor/summary/meta e chips de ano (foco já saiu)
    return;
  }
  const rh = e.target.closest("[data-runh]");
  if (rh && g.runs){ const i=Number(rh.dataset.runh); if (g.runs[i]) { g.runs[i].horas=Number(rh.value)||0; saveJogosQuiet(); } return; }
  const ra = e.target.closest("[data-runano]");
  if (ra && g.runs){ const i=Number(ra.dataset.runano); if (g.runs[i]) { g.runs[i].anoJog = ra.value===""?null:Number(ra.value); saveJogosQuiet(); render(); } }
});
/* ---------- plano 2026 (editável, sincronizado) ---------- */
const LS_PLANO = "perfil-gamer:plano";
let P = [];              // itens do plano [{jogo,est,data,iniciado,jid}]
let HS = {};             // ajuste de horas por semana { "<segunda ISO>": nº } — quando vazio usa o padrão (10h)
const estH = s => { const m = String(s??"").match(/[\d.]+/); return m ? parseFloat(m[0]) : 0; };

/* --- orçamento de horas: calculado automaticamente a partir de hoje até 31/01/2027 --- */
const PLANO_FIM = "2027-01-31";           // horizonte do plano
const HORAS_SEMANA = 10;                  // padrão de fábrica (↺ volta pra cá)
let padraoSemana = HORAS_SEMANA;          // horas/semana padrão — editável globalmente (vale pra todas as semanas sem ajuste)
const PERIODOS = [                        // exceções (por dia) — independem do padrão semanal
  { de:"2026-09-10", ate:"2026-09-19", hDia:0  },  // sem jogatina (viagem)
  { de:"2026-09-21", ate:"2026-09-24", hDia:10 },  // 10h por dia
];
function ymd(d){ return d.toISOString().slice(0,10); }
function horasDoDia(iso){
  for (const p of PERIODOS){ if (iso >= p.de && iso <= p.ate) return p.hDia; }
  return padraoSemana/7;                   // média diária do padrão semanal
}
// semana = segunda→domingo; a chave do ajuste é a segunda-feira
function segunda(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
// semanas do plano (de hoje até 31/jan) com o padrão de cada uma (soma de horasDoDia dos dias no intervalo)
function semanasPlano(){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const fim = new Date(PLANO_FIM+"T00:00:00");
  const out = [];
  for (let ws = segunda(hoje); ws <= fim; ws.setDate(ws.getDate()+7)){
    const we = new Date(ws); we.setDate(we.getDate()+6);
    const de = ws < hoje ? new Date(hoje) : new Date(ws);
    const ate = we > fim ? new Date(fim) : new Date(we);
    let def = 0;
    for (let d = new Date(de); d <= ate; d.setDate(d.getDate()+1)) def += horasDoDia(ymd(d));
    out.push({ key: ymd(ws), de, ate, def: Math.round(def) });
  }
  return out;
}
// horas efetivas da semana: o ajuste manual (se houver) ou o padrão
function horasDaSemana(w){ return HS[w.key] != null ? HS[w.key] : w.def; }
function horasDisponiveis(){ return Math.round(semanasPlano().reduce((s,w)=>s+horasDaSemana(w),0)); }
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function fmtData(iso){
  if (!iso) return "s/ data";
  const [a,m,dd] = iso.split("-"); return `${dd}/${MESES[Number(m)-1]}`;
}
function fmtSemana(w){
  const a=w.de, b=w.ate, ma=MESES[a.getMonth()], mb=MESES[b.getMonth()];
  return ma===mb ? `${a.getDate()}–${b.getDate()}/${ma}` : `${a.getDate()}/${ma} – ${b.getDate()}/${mb}`;
}
function savePlano(){
  const payload = { itens: P, horasSemana: HS, padraoSemana };
  try { localStorage.setItem(LS_PLANO, JSON.stringify(payload)); } catch(e){}
  fetch(`${SYNC_URL}/plano2026.json`, { method:"PUT", body: JSON.stringify(payload) })
    .then(()=>{ cloudOK = true; syncStamp = Date.now();
      fetch(`${SYNC_URL}/_at.json`, { method:"PUT", body: JSON.stringify(syncStamp) }).catch(()=>{});
      render(); })
    .catch(()=>{ cloudOK = false; render(); });
}

async function boot(){
  try { const raw = localStorage.getItem(LS_KEY); if (raw) J = JSON.parse(raw); } catch(e){}
  try { const raw = localStorage.getItem(LS_PLANO); if (raw){ const p = JSON.parse(raw);
    if (p && Array.isArray(p.itens)) P = p.itens;
    if (p && p.horasSemana && typeof p.horasSemana==="object") HS = p.horasSemana;
    if (p && Number.isFinite(p.padraoSemana)) padraoSemana = p.padraoSemana; } } catch(e){}
  render();  // 1ª pintura com a cópia do aparelho (evita "piscar" o seed antigo)
  try {
    const r = await fetch(`${SYNC_URL}/jogos.json`, { cache:"no-store" });
    if (r.ok) {
      const v = await r.json();
      if (Array.isArray(v) && v.length) { J = v; cloudOK = true; try{localStorage.setItem(LS_KEY, JSON.stringify(J));}catch(e){} }
      else { cloudOK = true; saveJogos(); }
    }
  } catch(e){ cloudOK = false; }
  // migração: veredicto antigo "Medíocre" → "Mediano" + backfill do ano de lançamento (do seed)
  let migrou = false;
  J.forEach(g=>{
    if (g.v === "Medíocre"){ g.v = "Mediano"; migrou = true; }
    if (g.ano == null){ const a = anoSeed(g); if (a != null){ g.ano = a; migrou = true; } }
  });
  if (migrou){ try{localStorage.setItem(LS_KEY, JSON.stringify(J));}catch(e){} if (cloudOK) saveJogos(); }
  // migração ÚNICA (marcador na nuvem): anoJog = ano de lançamento p/ jogos de 1 jogatina; Avowed = 2026
  if (cloudOK){
    try {
      const mr = await fetch(`${SYNC_URL}/migAnoJog.json`, { cache:"no-store" });
      const done = mr.ok ? await mr.json() : null;
      if (!done){
        let mudou = false;
        J.forEach(g=>{
          if (/avowed/i.test(g.nome||"")){ if (g.anoJog==null){ g.anoJog = 2026; mudou = true; } return; }
          if (g.runs && g.runs.length) return;                       // só jogos de 1 jogatina
          if (Number.isFinite(g.ano) && g.anoJog==null){ g.anoJog = g.ano; mudou = true; }
        });
        if (mudou){ try{localStorage.setItem(LS_KEY, JSON.stringify(J));}catch(e){} saveJogos(); }
        fetch(`${SYNC_URL}/migAnoJog.json`, { method:"PUT", body:"true" }).catch(()=>{});
      }
    } catch(e){}
  }
  try {
    const r = await fetch(`${SYNC_URL}/plano2026.json`, { cache:"no-store" });
    if (r.ok) {
      const v = await r.json();
      if (v && Array.isArray(v.itens)) P = v.itens;
      else if (P.length === 0 && Array.isArray(window.PLANO)) { P = window.PLANO.slice(); savePlano(); }
      if (v && v.horasSemana && typeof v.horasSemana==="object") HS = v.horasSemana;
      if (v && Number.isFinite(v.padraoSemana)) padraoSemana = v.padraoSemana;
    }
  } catch(e){}
  if (P.length === 0 && Array.isArray(window.PLANO)) P = window.PLANO.slice();
  // migração: itens antigos ({lanc,status}) → garante campo data
  P.forEach(p=>{ if (p.data === undefined) p.data = ""; });
  try { const r = await fetch(`${SYNC_URL}/_at.json`, { cache:"no-store" });
    const v = await r.json(); if (typeof v === "number") syncStamp = v; } catch(e){}
  render();
}

  fetch(`${SYNC_URL}/_at.json`, { cache:"no-store" }).then(r=>r.json())
    .then(v=>{ if (typeof v === "number" && v > syncStamp + 1500) location.reload(); }).catch(()=>{});
});

const LEGADO_ANO = 2020;   // anos < 2020 agrupam num único chip "Legado (<2020)" (token "lt")
// um ano casa a seleção se estiver escolhido, ou se for legado (<2020) e o chip "lt" estiver ativo
function anoCasa(sel, y){ return y!=null && (sel.has(String(y)) || (sel.has("lt") && y<LEGADO_ANO)); }
function aplicarFiltros(lst){
  if (fStatus.size) lst = lst.filter(g=>fStatus.has(g.enc));
  if (fVer.size) lst = lst.filter(g=>fVer.has(g.v));
  if (fAno.size) lst = lst.filter(g=>anoCasa(fAno, g.ano));
  if (fAnoJog.size) lst = lst.filter(g=>anosDoJogo(g).some(y=>anoCasa(fAnoJog, y)));
  return lst;
}
// monta os chips de ano: individuais p/ >=2020 + um "Legado (<2020)" se houver antigos
function chipsAno(anos, sel, attr){
  const recentes = anos.filter(a=>a>=LEGADO_ANO);
  let html = recentes.map(a=>`<button type="button" class="fchip ${sel.has(String(a))?"on":""}" ${attr}="${a}">${a}</button>`).join("");
  if (anos.some(a=>a<LEGADO_ANO)) html += `<button type="button" class="fchip ${sel.has("lt")?"on":""}" ${attr}="lt">Legado &lt;${LEGADO_ANO}</button>`;
  return html;
}
// rótulo de um chip ativo de ano ("lt" = legado)
function labelAno(a){ return a==="lt" ? `Legado <${LEGADO_ANO}` : a; }
// anos distintos presentes na biblioteca, do mais novo p/ o mais antigo
function anosDisponiveis(){
  return [...new Set(J.map(g=>g.ano).filter(a=>a!=null))].sort((a,b)=>b-a);
}
// anos em que cada jogatina foi jogada (W1 = g.anoJog; W2+ = run.anoJog)
function anosDoJogo(g){
  const ys = [];
  if (g.anoJog!=null) ys.push(g.anoJog);
  (g.runs||[]).forEach(r=>{ if (r && r.anoJog!=null) ys.push(r.anoJog); });
  return ys;
}
// anos jogados distintos na biblioteca, do mais novo p/ o mais antigo
function anosJogadosDisp(){
  const s = new Set();
  J.forEach(g=>anosDoJogo(g).forEach(y=>s.add(y)));
  return [...s].sort((a,b)=>b-a);
}

function statusTxt(e){ return e==="S"?"✅ zerado":(e==="N"?"❌ dropado":"🔄 jogando"); }
function vpill(v){
  const c = VC[v];
  return c ? `<span class="vpill" style="--vc:${c[0]};--vs:${c[1]}">${c[2]} ${esc(v)}</span>`
           : `<span class="vpill">sem veredicto</span>`;
}
/* ---------- jogatinas (playthroughs): só HORAS por jogatina; veredicto/status = 1 por jogo ---------- */
function runHoras(g){ return [g.horas||0, ...((g.runs||[]).map(r=>(r&&r.horas)||0))]; }  // [W1, W2, …]
function nRuns(g){ return 1 + ((g.runs||[]).length); }
function totalHoras(g){ return runHoras(g).reduce((s,h)=>s+h,0); }
function runsResumo(g){ return runHoras(g).map((h,i)=>`W${i+1} ${h}h`).join(" · "); }
// horas do jogo p/ o resumo do filtro: se o filtro "🎮 Joguei no ano" estiver ativo,
// soma só as jogatinas jogadas naquele(s) ano(s) (W1 = g.anoJog · W2+ = run.anoJog); senão, soma tudo
function horasNoFiltro(g){
  if (horasOcultas(g)) return 0;
  if (!fAnoJog.size) return totalHoras(g);
  let s = 0;
  if (g.anoJog!=null && anoCasa(fAnoJog, g.anoJog)) s += (g.horas||0);
  (g.runs||[]).forEach(r=>{ if (r && r.anoJog!=null && anoCasa(fAnoJog, r.anoJog)) s += (r.horas||0); });
  return s;
}
function horasOcultas(g){ return /FINAL FANTASY XIV/i.test(g.nome||""); }
/* jogos "sem fim" (live-service): nos gráficos de horas por ano, limitados a um teto p/ não distorcer o ano */
const HORAS_TETO = 150;
function ehSemFim(g){ return /path of exile|diablo iv/i.test(g.nome||""); }
// fator (0–1) que escala as horas do jogo nos gráficos de distribuição; 1 = sem corte
function fatorTeto(g){ const t=totalHoras(g); return (ehSemFim(g) && t>HORAS_TETO) ? HORAS_TETO/t : 1; }

/* ---------- aba Estatísticas ---------- */
function viewStats(){
  const rated = J.filter(g=>ORD.includes(g.v));
  // gráfico "Distribuição" configurável: por veredicto, por ano de lançamento ou por ano jogado
  const distData = dim => {
    if (dim==="ver"){
      const m={}; ORD.forEach(v=>m[v]=0); rated.forEach(g=>m[g.v]++);
      return ORD.slice().reverse().filter(v=>m[v]>0)
        .map(v=>({label:v, n:m[v], color:VC[v][0], ic:VC[v][2]}));
    }
    // anos: contagem de jogos + horas por ano. lançamento = g.ano (1 por jogo);
    // jogado = anos distintos por jogo (contagem) com horas por jogatina (W1=g.horas, W2+=run.horas)
    // anos < 2020 (era PS4) são outliers e ficam de fora destes gráficos (key = null)
    const key = y => (y==null || y<LEGADO_ANO) ? null : String(y);
    const cnt=new Map(), hrs=new Map();
    const addH=(k,h)=>{ if (k==null) return; hrs.set(k,(hrs.get(k)||0)+h); };
    if (dim==="lanc"){
      J.forEach(g=>{ const k=key(g.ano); if (k==null) return;
        cnt.set(k,(cnt.get(k)||0)+1); addH(k, horasOcultas(g)?0:totalHoras(g)*fatorTeto(g)); });
    } else {
      J.forEach(g=>{
        [...new Set(anosDoJogo(g).map(key).filter(k=>k!=null))].forEach(k=>cnt.set(k,(cnt.get(k)||0)+1)); // jogo distinto por ano
        const f = horasOcultas(g) ? 0 : fatorTeto(g);   // 0 = oculto; <1 = jogo sem fim (teto)
        if (g.anoJog!=null) addH(key(g.anoJog), (g.horas||0)*f);
        (g.runs||[]).forEach(r=>{ if (r && r.anoJog!=null) addH(key(r.anoJog), (r.horas||0)*f); });
      });
    }
    const keys=[...cnt.keys()].sort((a,b)=> a==="lt"?1 : b==="lt"?-1 : Number(b)-Number(a));
    return keys.map(k=>({label:labelAno(k), n:cnt.get(k), hrs:Math.round(hrs.get(k)||0), color:"var(--accent)", ic:""}));
  };
  const dimLbl = {ver:"⭐ Veredicto", lanc:"📅 Lançamento", jogou:"🎮 Ano jogado"};
  const dimChips = `<div class="frow" style="margin-bottom:12px">${
    Object.entries(dimLbl).map(([d,l])=>`<button type="button" class="fchip ${statDim===d?"on":""}" data-statdim="${d}">${l}</button>`).join("")}</div>`;
  const dd = distData(statDim);
  const showPct = statDim==="ver";                 // veredicto: barra=contagem + %; anos: barra=horas + contagem
  const sumN = dd.reduce((s,x)=>s+x.n,0) || 1;
  const maxBar = showPct ? Math.max(...dd.map(x=>x.n),1) : Math.max(...dd.map(x=>x.hrs||0),1);
  const distBars = dd.map(x=>{
    const barVal = showPct ? x.n : (x.hrs||0);
    const right = showPct
      ? `<b class="num">${x.n}</b><span class="dbpct num">${Math.round(x.n/sumN*100)}%</span>`
      : `<div class="dbstack"><b class="num">${(x.hrs||0).toLocaleString("pt-BR")}h</b><span class="dbsub num">${x.n} ${x.n===1?"jogo":"jogos"}</span></div>`;
    return `
    <div class="dbar">
      <div class="dblbl"${x.color!=="var(--accent)"?` style="color:${x.color}"`:""}>${x.ic?x.ic+" ":""}${esc(x.label)}</div>
      <div class="dbtrack"><div class="dbfill" style="width:${Math.max(barVal/maxBar*100,4)}%;background:${x.color}"></div></div>
      <div class="dbval ${showPct?"":"stack"}">${right}</div>
    </div>`;
  }).join("") || '<p class="lead" style="margin:6px 2px">Sem dados.</p>';
  const tetoNote = `Jogos sem fim (Path of Exile 2, Diablo IV) entram no máximo com ${HORAS_TETO}h para não distorcer o ano.`;
  const distNote = statDim==="jogou" ? `<p class="dnote">Contagem: um jogo rejogado em anos diferentes conta em cada ano. Horas: cada jogatina soma no ano em que foi jogada. ${tetoNote}</p>`
                 : statDim==="lanc" ? `<p class="dnote">${tetoNote}</p>` : "";
  const bars = dimChips + distBars + distNote;
  const distSub = statDim==="ver" ? `${rated.length} avaliados` : `${dd.length} ${dd.length===1?"ano":"anos"}`;
  let topLst = J.slice().filter(g=>!horasOcultas(g));
  if (statVer) topLst = topLst.filter(g=>g.v===statVer);
  const topRows = topLst.sort((a,b)=>totalHoras(b)-totalHoras(a)).slice(0,10).map((g,i)=>
    `<div class="rowline"><span class="pos num">${i+1}</span>
      <span class="dot" style="background:${VC[g.v]?VC[g.v][0]:"var(--line)"}"></span>
      <span class="nm">${esc(g.nome)}</span>${g.enc==="N"?'<span class="droptag" title="dropado">❌</span>':""}<span class="hv num">${totalHoras(g)}h</span></div>`).join("")
    || '<p class="lead" style="margin:6px 2px">Nenhum jogo com esse veredicto.</p>';
  const topChips = `<div class="frow" style="margin-bottom:12px">
    <button type="button" class="fchip ${statVer===""?"on":""}" data-statver="">Todos</button>
    ${ORD.slice().reverse().map(v=>`<button type="button" class="fchip ${statVer===v?"on":""}" style="--vc:${VC[v][0]}" data-statver="${esc(v)}"><span class="cdot" style="background:${VC[v][0]}"></span>${esc(v)}</button>`).join("")}
  </div>`;
  const gen = {};
  J.forEach(g=>{ const k=(g.genres||"?").split(",")[0].trim(); (gen[k]=gen[k]||[]).push(g); });
  const genRows = Object.entries(gen).sort((a,b)=>b[1].length-a[1].length).slice(0,10).map(([k,v])=>{
    const c=v.filter(x=>x.enc==="S").length, d=v.filter(x=>x.enc==="N").length, fin=Math.max(c+d,1);
    const hrs=v.reduce((s,x)=>s+(horasOcultas(x)?0:totalHoras(x)),0);
    return `<div class="gcell"><div class="t">${esc(k)}</div>
      <div class="n num">${v.length} jogos · ${Math.round(hrs).toLocaleString("pt-BR")}h<br>zera ${Math.round(c/fin*100)}% · dropa ${Math.round(d/fin*100)}%</div></div>`;
  }).join("");
  const dropsLst = J.filter(g=>g.enc==="N").sort((a,b)=>totalHoras(b)-totalHoras(a));
  const drops = dropsLst.map(g=>`<div class="droprow">
    <div class="dhead"><span class="dot" style="background:${VC[g.v]?VC[g.v][0]:"var(--line)"}"></span>
      <span class="dnm">${esc(g.nome)}</span><span class="dhv num">${totalHoras(g)}h</span></div>
    ${g.motivo?`<div class="dmot">${esc(g.motivo)}</div>`:""}</div>`).join("")
    || '<p class="lead" style="margin:6px 2px">Nenhum drop registrado.</p>';
  // tempo total
  const jogaveis = J.filter(g=>!horasOcultas(g) && totalHoras(g)>0);
  const totalH = jogaveis.reduce((s,g)=>s+totalHoras(g),0);
  const mediaH = jogaveis.length ? totalH/jogaveis.length : 0;
  const dias = totalH/24;
  const overview = `<div class="strip" style="margin-bottom:10px">
    <div class="cell"><div class="v num">${Math.round(totalH).toLocaleString("pt-BR")}h</div><div class="k">horas totais</div></div>
    <div class="cell"><div class="v num">${Math.round(mediaH)}h</div><div class="k">média/jogo</div></div>
    <div class="cell"><div class="v num">${Math.round(dias)}</div><div class="k">dias jogados</div></div>
  </div>`;
  // seções recolhíveis
  const sec = (id,ic,title,sub,inner)=>`<details class="sec" data-sec="${id}" ${secOpen.has(id)?"open":""}>
      <summary><span class="sic">${ic}</span><span>${title}</span>${sub?`<span class="ssub">${sub}</span>`:'<span style="margin-left:auto"></span>'}<span class="schev">▸</span></summary>
      <div class="secbody">${inner}</div></details>`;
  return `${overview}
    ${sec("ver","📊","Distribuição", distSub, bars)}
    ${sec("top","⏱","Top horas", statVer||"", topChips+topRows)}
    ${sec("gen","🎯","Por gênero", "", `<div class="ggrid">${genRows}</div>`)}
    ${sec("drop","❌","Drops", `${dropsLst.length}`, drops)}`;
}

/* ---------- aba Plano ---------- */
function viewPlano(){
  const disp = horasDisponiveis();
  // jogo do plano ligado à biblioteca: entre os de nome igual/parecido (+ o do jid), pega o com MAIS horas (o real, não uma duplicata)
  const linked = p => {
    if (!p.iniciado) return null;
    const key = (p.jogo||"").trim().toLowerCase();
    const cands = J.filter(x=>{ const n=(x.nome||"").trim().toLowerCase(); return n===key || (key.length>=4 && (n.includes(key)||key.includes(n))); });
    if (p.jid!=null){ const byId=J.find(x=>x.id===p.jid); if (byId && !cands.includes(byId)) cands.push(byId); }
    return cands.length ? cands.sort((a,b)=>totalHoras(b)-totalHoras(a))[0] : null;
  };
  // horas já jogadas na jogatina atual = a última jogatina (a em andamento)
  const jogadasAtual = g => { const h=runHoras(g); return h[h.length-1]||0; };
  // horas que ainda faltam pra cada jogo: estimativa menos o que já foi jogado (0 se zerou/dropou)
  const faltaH = p => { const est=estH(p.est); const g=linked(p);
    if (g) return g.enc==="#" ? Math.max(est-jogadasAtual(g),0) : ((g.enc==="S"||g.enc==="N")?0:Math.max(est-(g.horas||0),0));
    return est; };
  const somaEst = P.reduce((s,p)=>s+faltaH(p),0);
  const rest = disp - somaEst;
  const cabe = rest >= 0;
  const cor = cabe ? "var(--mb)" : "var(--mr)";
  const pct = disp>0 ? Math.min(somaEst/disp*100,100) : 0;
  // fila ordenada por data (sem data vai pro fim)
  const fila = P.map((p,i)=>({p,i})).sort((a,b)=>{
    const da=a.p.data||"9999", db=b.p.data||"9999";
    return da<db?-1:da>db?1:0;
  });
  const rows = fila.length ? fila.map(({p,i})=>{
    const est=estH(p.est), g=linked(p), falta=faltaH(p);
    let sub = est?est+"h":"—";
    if (g && g.enc==="#") sub = `${jogadasAtual(g)}h de ${est}h · faltam ${Math.round(falta)}h`;
    else if (g && g.enc==="S") sub = `✅ zerado (${totalHoras(g)}h)`;
    else if (g && g.enc==="N") sub = `❌ dropado (${totalHoras(g)}h)`;
    return `<div class="pitem">
      <span class="pwhen">${esc(fmtData(p.data))}</span>
      <div class="pbody"><div class="t">${p.iniciado?'🎮 ':''}${esc(p.jogo)}</div>
        <div class="s num">${sub}</div></div>
      <div class="pacts">
        ${p.iniciado?'':`<button type="button" class="pbtn" data-pjogar="${i}" title="Marcar como jogando agora">▶️</button>`}
        <button type="button" class="pbtn" data-peditar="${i}" title="Editar">✏️</button>
        <button type="button" class="pbtn del" data-pexcluir="${i}" title="Excluir">🗑</button>
      </div>
    </div>`;
  }).join("") : '<p class="lead" style="margin:6px 2px">Nenhum jogo planejado ainda.</p>';
  // ajuste de horas por semana (padrão global editável; e por semana na respectiva linha)
  const semanas = semanasPlano();
  const nAjust = semanas.filter(w=>HS[w.key]!=null).length;
  const padOn = padraoSemana!==HORAS_SEMANA;
  const padRow = `<div class="wkrow wkpad">
      <span class="wklbl"><b>Padrão de todas as semanas</b></span>
      <input class="wkinp${padOn?" on":""}" type="number" min="0" step="1" inputmode="numeric" id="padSemana" value="${padraoSemana}">
      <span class="wkun">h</span>
      ${padOn?`<button type="button" class="wkrst" data-padreset="1" title="Voltar ao padrão de fábrica (${HORAS_SEMANA}h)">↺</button>`:'<span class="wkrst-ph"></span>'}
    </div>`;
  const wkRows = semanas.map(w=>{
    const ef = horasDaSemana(w), on = HS[w.key]!=null;
    return `<div class="wkrow">
      <span class="wklbl">${fmtSemana(w)}</span>
      <input class="wkinp${on?" on":""}" type="number" min="0" step="1" inputmode="numeric" data-wk="${w.key}" value="${ef}">
      <span class="wkun">h</span>
      ${on?`<button type="button" class="wkrst" data-wkreset="${w.key}" title="Voltar ao padrão (${w.def}h)">↺</button>`:'<span class="wkrst-ph"></span>'}
    </div>`;
  }).join("");
  const wkSub = nAjust ? `padrão ${padraoSemana}h · ${nAjust} ajustada${nAjust>1?"s":""}` : `padrão ${padraoSemana}h`;
  const wkSec = `<details class="wkbox" ${wkOpen?"open":""}>
    <summary><span>⚙️ Ajustar horas por semana</span><span class="wksub">${wkSub}</span><span class="schev">▸</span></summary>
    <div class="wkbody"><p class="wknote">Mude o <b>padrão</b> pra trocar todas as semanas de uma vez (ex.: 10 → 8). Depois dá pra ajustar semanas específicas por baixo — o total <b>disponível</b> recalcula sozinho.</p>${padRow}${wkRows}</div>
  </details>`;
  return `<p class="lead">Fila até 31/jan/2027. Cada semana vale ${padraoSemana}h por padrão (mude o padrão ou semanas específicas em "⚙️ Ajustar horas por semana"; 21–24/set já vem 10h/dia; sem jogatina 10–19/set). O "falta" desconta as horas que você já jogou do jogo atual.</p>
    <h2>⏳ Horas disponíveis</h2>
    <div class="card">
      <div class="strip" style="margin:0">
        <div class="cell"><div class="v num">${Math.round(somaEst)}h</div><div class="k">falta na fila</div></div>
        <div class="cell"><div class="v num">${disp}h</div><div class="k">disponível</div></div>
        <div class="cell"><div class="v num" style="color:${cor}">${cabe?"":"−"}${Math.abs(Math.round(rest))}h</div><div class="k">${cabe?"sobra":"falta"}</div></div>
      </div>
      <div class="bar" style="margin-top:12px"><div class="track"><div class="fill" style="width:${Math.max(pct,3)}%;background:${cor}">${Math.round(pct)}%</div></div></div>
      <div class="lead" style="margin:8px 2px 0;color:${cor}">${cabe?`✓ Cabe no tempo — sobram ${Math.round(rest)}h até 31/jan.`:`⚠ Passou ${Math.abs(Math.round(rest))}h do disponível. Tire um jogo ou reduza estimativas.`}</div>
    </div>
    ${wkSec}
    <button type="button" class="addbtn" id="btnAddPlano">➕ Adicionar jogo planejado</button>
    <h2>🗓 Fila de jogos (por data)</h2><div class="card">${rows}</div>`;
}

/* ---------- render ---------- */
const VIEWS = {jogos:viewJogos, stats:viewStats, plano:viewPlano};
let _lastTab = null;
function render(){
  $("#tabbar").innerHTML = TABS.map(([id,l,ic])=>
    `<button type="button" data-tab="${id}" class="${id===tab?'on':''}"><span class="ic">${ic}</span><span>${l}</span></button>`).join("");
  $("#content").innerHTML = VIEWS[tab]();
  if (tab !== _lastTab){ const c=$("#content"); c.style.animation="none"; void c.offsetWidth; c.style.animation="fadeUp .22s ease"; _lastTab=tab; }
  const st = $("#syncTag");
  st.textContent = cloudOK ? "sincronizado ✓" : "offline · salva no aparelho";
  st.className = "synctag" + (cloudOK ? "" : " off");
  const b = $("#busca"); if (b){ b.addEventListener("input", e=>{ busca=e.target.value;
    const pos = b.selectionStart; render(); const nb=$("#busca"); if(nb){ nb.focus(); nb.setSelectionRange(pos,pos); }
  }); }
  document.querySelectorAll("details.sec").forEach(d=>d.addEventListener("toggle", ()=>{
    d.open ? secOpen.add(d.dataset.sec) : secOpen.delete(d.dataset.sec);
  }));

  if (wb) wb.addEventListener("toggle", ()=>{ wkOpen = wb.open; });
}

/* ---------- registrar / editar / excluir ---------- */
let editId = null;
function openModal(g){
  editId = g ? g.id : null;
  $("#mTitle").textContent = g ? "Editar jogo" : "Registrar jogo";
  $("#fNome").value = g?.nome || "";
  $("#fAno").value = g?.ano ?? "";
  $("#fAnoJog").value = g?.anoJog ?? "";
  $("#fHoras").value = g?.horas ?? "";
  $("#fEnc").value = g?.enc || "#";
  $("#fV").value = (g && ORD.includes(g.v)) ? g.v : "N/A";
  $("#fGenres").value = g?.genres || "";
  $("#fMotivo").value = g?.motivo || "";
  const iv = (x)=> (x==null||x==="N/A") ? "" : x;
  $("#fH").value = iv(g?.h); $("#fG").value = iv(g?.g); $("#fD").value = iv(g?.d); $("#fFF").value = iv(g?.ff);
  // jogatinas: só ao editar um jogo existente
  const multi = g && nRuns(g)>1;
  $("#fHorasLbl").textContent = multi ? "Horas (1ª jogatina)" : "Horas";
  if (g){ $("#mRunsWrap").style.display=""; renderMRuns(g); } else { $("#mRunsWrap").style.display="none"; $("#mRuns").innerHTML=""; }
  $("#modal").classList.remove("hidden");
  setTimeout(()=>$("#fNome").focus(), 60);
}
function runRowHtml(wn, val, ano){
  return `<div class="runrow">
    <span class="rlbl">W${wn}</span>
    <input class="runh" type="number" min="0" step="0.5" inputmode="decimal" value="${val}" aria-label="Horas W${wn}" />
    <span style="color:var(--muted);font-size:.72rem">h</span>
    <input class="runano" type="number" min="1990" max="2100" step="1" inputmode="numeric" value="${ano??""}" placeholder="ano" aria-label="Ano W${wn}" />
    <button type="button" class="pbtn del" data-rundelrow title="Remover jogatina">✕</button>
  </div>`;
}
function renumberRuns(){ [...document.querySelectorAll("#mRuns .runrow")].forEach((row,i)=>{ row.querySelector(".rlbl").textContent = "W"+(i+2); }); }
function renderMRuns(g){
  const ex = (g && g.runs) || [];
  $("#mRuns").innerHTML = ex.map((r,i)=>runRowHtml(i+2, r.horas ?? 0, r.anoJog)).join("");
}
function closeModal(){ $("#modal").classList.add("hidden"); editId = null; }
$("#mCancel").addEventListener("click", closeModal);
$("#modal").addEventListener("click", e=>{ if (e.target === $("#modal")) closeModal(); });
$("#mSave").addEventListener("click", ()=>{
  const nome = $("#fNome").value.trim();
  if (!nome){ $("#fNome").focus(); return; }
  const numOr = (id, def)=>{ const v = $(id).value; return v==="" ? def : Number(v); };
  // jogatinas extras (W2+), lidas inline — horas + ano jogado
  const runs = [...document.querySelectorAll("#mRuns .runrow")].map(row=>{
    const o = { horas: Number(row.querySelector(".runh")?.value)||0 };
    const a = row.querySelector(".runano")?.value;
    if (a!=="" && a!=null) o.anoJog = Number(a);
    return o;
  });
  const reg = {
    nome, ano: numOr("#fAno", null), anoJog: numOr("#fAnoJog", null), horas: numOr("#fHoras", 0), enc: $("#fEnc").value,
    motivo: $("#fMotivo").value.trim(), genres: $("#fGenres").value.trim(),
    h: numOr("#fH", null), g: numOr("#fG", null), d: numOr("#fD", null), ff: numOr("#fFF", null),
    v: $("#fV").value, runs
  };
  if (editId != null){
    const i = J.findIndex(x=>x.id===editId);
    if (i>=0) J[i] = Object.assign({}, J[i], reg);   // preserva w
  } else {
    reg.id = J.reduce((m,x)=>Math.max(m, x.id||0), 0) + 1;
    reg.w = 1;
    J.push(reg);
  }
  closeModal(); saveJogos(); render();
});
// adicionar jogatina: cria uma linha de horas inline (sem abrir outra tela)
$("#mAddRun").addEventListener("click", ()=>{
  const wn = document.querySelectorAll("#mRuns .runrow").length + 2;
  $("#mRuns").insertAdjacentHTML("beforeend", runRowHtml(wn, ""));
  const inputs = document.querySelectorAll("#mRuns .runh");
  inputs[inputs.length-1].focus();
});

/* ---------- backup export / import ---------- */
function openBackup(){ $("#bmodal").classList.remove("hidden"); }
function closeBackup(){ $("#bmodal").classList.add("hidden"); }
$("#btnMenu").addEventListener("click", openBackup);
$("#bClose").addEventListener("click", closeBackup);
$("#bmodal").addEventListener("click", e=>{ if (e.target === $("#bmodal")) closeBackup(); });
$("#bExport").addEventListener("click", ()=>{
  const data = { app:"perfil-gamer", exportedAt:new Date().toISOString(), jogos:J, plano:{ itens:P } };
  const blob = new Blob([JSON.stringify(data,null,2)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `perfil-gamer-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
});
$("#bImport").addEventListener("click", ()=>$("#bFile").click());
$("#bFile").addEventListener("change", e=>{
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try {
      const d = JSON.parse(r.result);
      const js = Array.isArray(d.jogos) ? d.jogos : (Array.isArray(d) ? d : null);
      if (!js){ alert("Arquivo inválido — não encontrei a lista de jogos."); return; }
      if (!confirm(`Importar ${js.length} jogo(s)? Isso substitui a biblioteca e o plano atuais.`)) return;
      js.forEach(g=>{ if (g && g.v === "Medíocre") g.v = "Mediano";
        if (g && g.ano == null){ const a = anoSeed(g); if (a != null) g.ano = a; } });
      J = js;
      if (d.plano && Array.isArray(d.plano.itens)){ P = d.plano.itens; P.forEach(p=>{ if (p.data === undefined) p.data = ""; }); }
      saveJogos(); savePlano(); closeBackup(); render();
    } catch(err){ alert("Não consegui ler o arquivo (JSON inválido)."); }
  };
  r.readAsText(f); e.target.value = "";
});

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-tab]"); if (t){ tab=t.dataset.tab; render(); window.scrollTo({top:0}); return; }
  if (e.target.closest("[data-filttoggle]")){ filtersOpen=!filtersOpen; render(); return; }
  const ts = e.target.closest("[data-tstatus]");
  if (ts){ const s=ts.dataset.tstatus; fStatus.has(s)?fStatus.delete(s):fStatus.add(s); render(); return; }
  const tv = e.target.closest("[data-tver]");
  if (tv){ const v=tv.dataset.tver; fVer.has(v)?fVer.delete(v):fVer.add(v); render(); return; }
  const ta = e.target.closest("[data-tano]");
  if (ta){ const a=ta.dataset.tano; fAno.has(a)?fAno.delete(a):fAno.add(a); render(); return; }
  const taj = e.target.closest("[data-tanojog]");
  if (taj){ const a=taj.dataset.tanojog; fAnoJog.has(a)?fAnoJog.delete(a):fAnoJog.add(a); render(); return; }
  if (e.target.closest("[data-unall]")){ fStatus.clear(); fVer.clear(); fAno.clear(); fAnoJog.clear(); render(); return; }
  const od = e.target.closest("[data-ordem]");
  if (od){ ordem = od.dataset.ordem; render(); return; }
  if (e.target.closest("#btnAdd")){ openModal(null); return; }
  const sv = e.target.closest("[data-statver]");
  if (sv){ statVer = sv.dataset.statver; render(); return; }
  const sd = e.target.closest("[data-statdim]");
  if (sd){ statDim = sd.dataset.statdim; render(); return; }
  if (e.target.closest("[data-padreset]")){ padraoSemana = HORAS_SEMANA; savePlano(); render(); return; }
  const wr = e.target.closest("[data-wkreset]");
  if (wr){ delete HS[wr.dataset.wkreset]; savePlano(); render(); return; }
  if (e.target.closest("#btnAddPlano")){ openPlano(null); return; }
  const pe = e.target.closest("[data-peditar]");
  if (pe){ openPlano(Number(pe.dataset.peditar)); return; }
  const px = e.target.closest("[data-pexcluir]");
  if (px){ const i=Number(px.dataset.pexcluir); if (P[i]){ P.splice(i,1); savePlano(); render(); } return; }
  const pj = e.target.closest("[data-pjogar]");
  if (pj){ const i=Number(pj.dataset.pjogar); const p=P[i]; if (!p) return;
    // liga como "jogando agora": reaproveita jogo existente (nome igual OU parecido) ou cria na biblioteca
    const key = (p.jogo||"").trim().toLowerCase();
    let g = J.find(x=>(x.nome||"").trim().toLowerCase()===key)
         || (key.length>=4 ? J.find(x=>{ const n=(x.nome||"").trim().toLowerCase(); return n && (n.includes(key)||key.includes(n)); }) : null);
    if (g){
      if (g.enc==="S"||g.enc==="N"){ (g.runs=g.runs||[]).push({horas:0}); } // já terminou → nova jogatina (NG+), só horas
      g.enc = "#";
    } else { g = { id: J.reduce((m,x)=>Math.max(m,x.id||0),0)+1, nome:p.jogo, horas:0, enc:"#",
                 w:1, v:"N/A", genres:"", motivo:"" }; J.push(g); }
    p.iniciado = true; p.jid = g.id;
    saveJogos(); savePlano(); tab="jogos"; render(); window.scrollTo({top:0}); return; }
  // ---- card = editor inline ----
  const ct = e.target.closest("[data-cardtoggle]");
  if (ct){ const id=Number(ct.dataset.cardtoggle); openGame = (openGame===id)?null:id; render();
    if (openGame!=null){ const el=document.querySelector(`.game[data-gid="${id}"]`); if (el) el.scrollIntoView({block:"nearest",behavior:"smooth"}); } return; }
  const hh = e.target.closest("[data-editar-hero]");
  if (hh){ openGame = Number(hh.dataset.editarHero); render();
    const el=document.querySelector(`.game[data-gid="${openGame}"]`); if (el) el.scrollIntoView({block:"center",behavior:"smooth"}); return; }
  const ar = e.target.closest("[data-addrun]");
  if (ar){ const g=J.find(x=>x.id===Number(ar.dataset.addrun)); if (g){ (g.runs=g.runs||[]).push({horas:0}); saveJogosQuiet(); render();
    const ins=document.querySelectorAll(`.game[data-gid="${g.id}"] .runh`); if(ins.length) ins[ins.length-1].focus(); } return; }
  const gd = e.target.closest("[data-grundel]");
  if (gd){ const card=gd.closest(".game"); const g=J.find(x=>x.id===Number(card.dataset.gid));
    if (g && g.runs){ g.runs.splice(Number(gd.dataset.grundel),1); if(!g.runs.length) delete g.runs; saveJogosQuiet(); render(); } return; }
  const ex = e.target.closest("[data-excluir]");
  if (ex){ const g = J.find(x=>String(x.id)===ex.dataset.excluir);
    if (g && confirm(`Excluir "${g.nome}" da biblioteca?`)){ J = J.filter(x=>x.id!==g.id); if(openGame===g.id) openGame=null; saveJogos(); render(); }
    return; }
});
boot();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", ()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
